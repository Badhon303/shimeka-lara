version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shimeka-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Glow & Glam"
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: glowglam
      DB_USERNAME: glowglam
      DB_PASSWORD: glowglam123
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - ./storage:/var/www/storage
      - ./.env:/var/www/.env:ro
    depends_on:
      - db
    networks:
      - shimeka-network

  db:
    image: postgres:16-alpine
    container_name: shimeka-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: glowglam
      POSTGRES_USER: glowglam
      POSTGRES_PASSWORD: glowglam123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - shimeka-network

volumes:
  pgdata:

networks:
  shimeka-network:
    driver: bridge
